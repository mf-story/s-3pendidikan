<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Aplikasi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="stage">
  <header class="masthead">
    <img class="logo" src="logo-unismuh.png" alt="Logo Universitas Muhammadiyah Makassar" />
    <h1 class="title">S-3 Pendidikan</h1>
    <p class="program">Program Pascasarjana</p>
    <p class="university">Universitas Muhammadiyah Makassar</p>
  </header>

  <div class="grid">
    <a class="card" href="https://mahasiswa.unismuh.ac.id/" target="_blank" rel="noopener" aria-label="SIMAK Mahasiswa">
      <div class="card-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10 12 5 2 10l10 5 10-5z" />
          <path d="M6 12v5c0 1 2.5 2.5 6 2.5s6-1.5 6-2.5v-5" />
          <path d="M22 10v5" />
        </svg>
      </div>
      <h3>SIMAK Mahasiswa</h3>
    </a>

    <a class="card" href="https://dosen.unismuh.ac.id/" target="_blank" rel="noopener" aria-label="SIMAK Dosen">
      <div class="card-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4" />
          <path d="M5.5 21a7.5 7.5 0 0 1 13 0" />
        </svg>
      </div>
      <h3>SIMAK Dosen</h3>
    </a>

    <a class="card" href="https://staf.unismuh.ac.id/" target="_blank" rel="noopener" aria-label="SIMAK Staf">
      <div class="card-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="14" rx="2" />
          <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M2 13h20M12 13v2" />
        </svg>
      </div>
      <h3>SIMAK Staf</h3>
    </a>

    <a class="card" href="https://agenda.unismuh.online/" target="_blank" rel="noopener" aria-label="Agenda Perkuliahan">
      <div class="card-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01" />
        </svg>
      </div>
      <h3>Agenda Perkuliahan</h3>
    </a>

    <a class="card" href="https://bimbingan.unismuh.online/" target="_blank" rel="noopener" aria-label="Bimbingan Online">
      <div class="card-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
          <path d="M8 9h8M8 13h5" />
        </svg>
      </div>
      <h3>Bimbingan Online</h3>
    </a>
  </div>
</main>
</body>
</html>
